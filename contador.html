<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freestyle Cypher — En vivo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="beat-tag oculto" id="beatTag">BEAT: —</div>

    <div id="introContainer">
        <div class="startIntro">
            <h2 id="titleStart">Empieza en</h2>
            <p class="secondStart">...</p>
        </div>
        <div>
            <h2 id="titleIntro"></h2>
        </div>
    </div>

    <div class="resumen-intro" id="resumenIntro">
        <h2 class="resumen-elegido">Elegido</h2>
        <hr>
        <div class="resumen-item">
            <span class="resumen-titulo">Beat</span>
            <span class="resumen-valor" id="resumenBeat">—</span>
        </div>

        <div class="resumen-item">
            <span class="resumen-titulo">Tiempo</span>
            <span class="resumen-valor" id="resumenTiempo">—</span>
        </div>

        <div class="resumen-item">
            <span class="resumen-titulo">Modo</span>
            <span class="resumen-valor" id="resumenModo">—</span>
        </div>
    </div>

    <div class="vinyl-wrap oculto">
        <div class="vinyl">
            <div class="label">
                <div class="num" id="timeNum">00:00</div>
            </div>
        </div>
        <div class="tonearm" id="tonearm"></div>
    </div>

    <div class="word-box oculto">
        <div class="kicker">Palabra</div>
        <div class="word" id="wordDisplay">FUEGO</div>
    </div>

    <script src="datos.js"></script>
    <script src="script.js"></script>
</body>

</html>
